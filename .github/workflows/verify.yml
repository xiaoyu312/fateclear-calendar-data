name: Verify data
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - name: DST table unchanged
        run: git diff --exit-code data/china_dst_1986_1991.csv
      - run: npm run verify
